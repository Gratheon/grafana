# G1 deprecation observation log includes the requested host so each entry remains
# attributable even when logs are aggregated during the 30-day observation period.
log_format gratheon_legacy_deprecation
    '$remote_addr - $remote_user [$time_local] '
    'host="$host" request="$request" status=$status bytes=$body_bytes_sent '
    'request_time=$request_time referer="$http_referer" '
    'user_agent="$http_user_agent" x_forwarded_for="$http_x_forwarded_for"';

server {
    listen 443 ssl; # managed by Certbot
    server_name grafana.gratheon.com;

    access_log /var/log/nginx/grafana-deprecation.access gratheon_legacy_deprecation;

    # Keep the server context free for Certbot's temporary HTTP-01 challenge location.
    location / {
        return 410;
    }

    ssl_certificate /etc/letsencrypt/live/app.gratheon.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.gratheon.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name grafana.gratheon.com;

    access_log /var/log/nginx/grafana-deprecation.access gratheon_legacy_deprecation;

    # Keep the server context free for Certbot's temporary HTTP-01 challenge location.
    location / {
        return 410;
    }
}

